<title>Year 10 D&amp;T Christmas Exam Revision Quiz</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2430;--mu:#5d6b7c;--pr:#1f6feb;--ok:#1a7f37;--okb:#dcf5e3;--no:#c62828;--nob:#fde4e4;--bd:#d6dce5}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#1a222d;--tx:#e8edf3;--mu:#9aa8b9;--pr:#5c9dff;--ok:#5fd17f;--okb:#17331f;--no:#ff7b7b;--nob:#3b1a1a;--bd:#2d3846;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.2rem;margin:.2em 0 .6em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:14px 0}
.mu{color:var(--mu);font-size:.9rem}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 16px}
button.p{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}
button:disabled{cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>button{flex:1;min-width:130px}
.big{font-size:1.2rem;padding:18px}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt.sv{text-align:center;padding:8px}
.opt.ok{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.fb{padding:10px 12px;border-radius:10px;margin:10px 0}.fb.ok{background:var(--okb);color:var(--ok)}.fb.no{background:var(--nob);color:var(--no)}
.bar{height:12px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.bar.low i{background:var(--no)}
.tag{display:inline-block;background:var(--bd);border-radius:20px;padding:2px 10px;font-size:.8rem;margin-bottom:6px}
.vis{display:block;margin:8px auto;max-width:100%;color:var(--tx)}
img.vis{max-width:260px;background:#fff;border:1px solid var(--bd);border-radius:8px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tl{display:grid;grid-template-columns:170px 1fr 48px;gap:8px;align-items:center;margin:6px 0;font-size:.9rem}
@media(max-width:520px){.tl{grid-template-columns:1fr 48px}.tl .bar{grid-column:1/-1;order:3}}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
</style>

swc:'<circle cx="22" cy="20" r="3.5"/><circle cx="58" cy="20" r="3.5"/><path d="M0 20h18.5M61.5 20h18.5M23 17L55 4"/>'};
const NAME={led:"LED",swc:"Switch",res:"Resistor",bat:"Battery"};
const COL={black:"#111",brown:"#7b4a1e",red:"#d32f2f",orange:"#f57c00",yellow:"#fbc02d",green:"#2e7d32",blue:"#1565c0",violet:"#7b1fa2",grey:"#888",white:"#fff",gold:"#d4af37",silver:"#c0c0c0"};
const svgOf=(k,w,h)=>`<svg class="vis" width="${w}" height="${h}" viewBox="0 -6 80 52" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Circuit symbol">${SYM[k]}</svg>`;

/* ---------- questions: in each, o[0] is the CORRECT answer (options are shuffled when shown) ---------- */
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const Q=[];
/* Topic 1: Electronic symbols (LED, switch, resistor, battery) */
const SK=["led","swc","res","bat"];
SK.forEach(k=>Q.push({t:0,sym:k,q:"What component does this symbol represent?",o:[NAME[k],...SK.filter(x=>x!==k).map(x=>NAME[x])],e:"This is the symbol for a "+NAME[k]+"."}));
SK.forEach(k=>Q.push({t:0,img:IM["c_"+k],q:"Which symbol matches the component in the picture?",o:[svgOf(k,100,52),...SK.filter(x=>x!==k).map(x=>svgOf(x,100,52))],e:"The picture shows a "+NAME[k]+", so it matches the "+NAME[k]+" symbol."}));
/* Topic 2: Resistor colour codes (worksheet rows and the colour chart) */
const rb=(bands,ans,w)=>Q.push({t:1,key:1,bands,q:"Use the colour chart to work out the resistance of this resistor.",o:[ans,...w],e:bands.slice(0,3).join(", ")+" gives "+ans+". Bands 1 and 2 are the digits and band 3 is the number of zeros."});
rb(["brown","black","red","silver"],"1000 Ω",["100 Ω","10 000 Ω","10 Ω"]);
rb(["orange","orange","brown","silver"],"330 Ω",["33 Ω","3300 Ω","30 Ω"]);
rb(["brown","black","orange","silver"],"10 000 Ω",["1000 Ω","100 000 Ω","100 Ω"]);
rb(["yellow","violet","brown","silver"],"470 Ω",["4700 Ω","47 Ω","407 Ω"]);
rb(["blue","blue","brown","silver"],"660 Ω",["66 Ω","6600 Ω","606 Ω"]);
rb(["grey","yellow","brown","silver"],"840 Ω",["8400 Ω","84 Ω","804 Ω"]);
rb(["orange","orange","black","silver"],"33 Ω",["330 Ω","3 Ω","303 Ω"]);
rb(["blue","red","red","silver"],"6200 Ω",["620 Ω","62 000 Ω","602 Ω"]);
rb(["violet","blue","blue","silver"],"76 000 000 Ω",["7 600 000 Ω","760 000 Ω","76 000 Ω"]);
rb(["brown","black","gold","silver"],"1 Ω",["10 Ω","0.1 Ω","100 Ω"]);
Q.push({t:1,key:1,q:"Which colour is used in band 4 to show a tolerance of ±10%?",o:["Silver","Gold","Red","Brown"],e:"Silver = ±10%. Gold = ±5%, red = ±2% and brown = ±1%."});
Q.push({t:1,key:1,q:"Which band 4 colour shows a tolerance of ±1%?",o:["Brown","Red","Green","Violet"],e:"Brown = ±1%, red = ±2%, green = ±0.5% and violet = ±0.1%."});
Q.push({t:1,key:1,q:"On a 4-band resistor, what does band 3 tell you?",o:["The number of zeros after the first two digits","The second digit of the value","The tolerance of the resistor","The first digit of the value"],e:"Bands 1 and 2 give the value. Band 3 is the multiplier and band 4 is the tolerance."});
Q.push({t:1,q:"What is the main job of a resistor in a circuit?",o:["To slow down the current, for example to protect an LED","To switch the current on and off","To store the electricity for later use","To make the circuit give out light"],e:"A resistor slows down the current in a circuit. In the lamp circuit it protects the LED."});
Q.push({t:1,q:"What is resistance measured in?",o:["Ohms (Ω)","Amps (A)","Volts (V)","Watts (W)"],e:"Resistance is measured in ohms, written with the symbol Ω."});
/* Topic 4: Workshop tools (the 9 tools in the Tools slide) */
const TOOLS=[["Tenon Saw","tenon"],["Try Square","trysq"],["Bench Hook","hook"],["Marking Gauge","gauge"],["Chisel","chisel"],["Mallet","mallet"],["Steel Rule","rule"],["Bench Vice","vice"],["Sand Paper","sandp"]];
TOOLS.forEach(([n,k])=>Q.push({t:3,img:IM[k],q:"Choose the correct name for the tool in the picture.",o:[n,...shuf(TOOLS.map(x=>x[0]).filter(x=>x!==n)).slice(0,3)],e:"This is a "+n.toLowerCase()+"."}));
/* Topic 3: How to Solder (basic) */
Q.push({t:2,q:"What should you wear to protect your eyes when soldering?",o:["Safety glasses","Sunglasses","Ear defenders","A dust mask"],e:"Hot solder can spit, so always wear safety glasses."});
Q.push({t:2,q:"Where should the soldering iron go when you are not using it?",o:["In its stand","Flat on a heatproof mat","Leaning against the circuit board","On top of the solder reel"],e:"The iron stays very hot, so it always goes back in its stand."});
Q.push({t:2,q:"Which is the correct order? A) Heat the pad and the component leg together, B) Feed solder onto the joint, C) Remove the solder, D) Remove the iron.",o:["A, B, C, D","B, A, C, D","A, C, B, D","A, B, D, C"],e:"Heat the pad and leg first, feed in the solder, take the solder away, then take the iron away."});
Q.push({t:2,q:"What is the job of flux in solder?",o:["It cleans the metal so the solder flows","It makes the solder cool faster","It makes the joint conduct better","It stops the iron tip getting too hot"],e:"Flux removes oxidation from the metal so the solder can flow and stick."});
Q.push({t:2,q:"Which description fits a good solder joint?",o:["Shiny and smooth, shaped like a small cone","Dull and grainy, with a ball of solder on top","Shiny, with solder joining two tracks together","A large blob that covers the whole pad and leg"],e:"A good joint is shiny and smooth. A ball or blob suggests the pad was not hot enough or too much solder was used."});
Q.push({t:2,q:"What is a cold joint?",o:["A dull, grainy joint where the solder did not flow properly","A shiny joint with too much solder","A joint where a component is the wrong way round","A joint that gets warm when the circuit is on"],e:"A cold joint happens when the pad and leg are not hot enough. It can stop the circuit working."});
Q.push({t:2,q:"Why should you solder in a well-ventilated room or use fume extraction?",o:["The fumes from the flux can irritate your lungs","The solder gives off carbon monoxide","The fumes can melt the circuit board","It stops the iron overheating"],e:"The fumes come mainly from the flux and should not be breathed in."});
Q.push({t:2,q:"You touch the tip of the soldering iron and burn your finger. What should you do first?",o:["Cool it under running water and tell your teacher","Put ice on it and carry on","Put cream on it and carry on","Wrap it in a plaster and carry on"],e:"Cool the burn under running cold water for at least 10 minutes and always tell your teacher."});
/* Topic 5: Design Question (basic) */
Q.push({t:4,q:"What is a design specification?",o:["A list of requirements the product must meet","A drawing of the finished product","A list of the tools in the workshop","A plan for how long the making will take"],e:"A specification lists what the product must do and be, so you can test it later."});
Q.push({t:4,q:"A torch is being designed for young children. Which is the best specification point?",o:["Must be no longer than 150 mm so it fits a small hand","Must be nice to hold","Must be a good colour","Must be easy to use"],e:"A good specification point can be measured or tested. It gives a size, a number or a clear requirement."});
Q.push({t:4,q:"Why do designers add annotations to a sketch?",o:["To explain the features, materials and sizes","To make the page look neat","To show how long the sketch took","To replace the specification"],e:"Annotations explain the ideas on a sketch, including what it is made from and why."});
Q.push({t:4,q:"Which material is best for the casing of a child's torch?",o:["ABS plastic: tough, light and easy to mould","Acrylic: clear and shiny, but it can crack if dropped","Mild steel: strong, but heavy and it can rust","MDF: cheap, but it soaks up water and swells"],e:"ABS is tough and light, so it suits a handheld product."});
Q.push({t:4,q:"What does ergonomics mean in design?",o:["Making a product comfortable and easy to use","Making a product cheap to make","Making a product look attractive","Making a product last a long time"],e:"Ergonomics is about how well a product fits the person using it."});
/* Topic 6: Evaluation (basic) */
Q.push({t:5,q:"What does it mean to evaluate a product?",o:["Test it against the specification and judge how well it works","Draw the final design neatly","Choose the materials before making it","Write a list of the tools needed"],e:"Evaluating means checking the product against the specification and saying how well it did."});
Q.push({t:5,q:"Which test checks that a torch switches on?",o:["Press the switch and see if the LED lights","Ask someone if they like the colour","Measure the length of the case","Weigh the battery"],e:"A good test checks the function you are looking for, here whether the LED lights when the switch is pressed."});
Q.push({t:5,q:"Your LED does not light up. What should you check first?",o:["That the LED and battery are the right way round and the joints are good","That the resistor value is as high as possible","That the case has been sanded smooth","That the battery is the biggest size available"],e:"Wrong polarity and poor solder joints are the most common faults in a simple circuit."});
Q.push({t:5,q:"Which is the strongest way to finish an evaluation point?",o:["Say what the test showed, link it to the specification and suggest a change","Say whether you enjoyed making it","Say how long the product took to make","Say who helped you with the product"],e:"A strong evaluation uses test evidence, refers to the specification and suggests an improvement."});
Q.push({t:5,q:"Why is feedback from users useful?",o:["It shows how well the product works for the people it was made for","It decides your final grade","It tells you which tools to buy","It replaces the need for testing"],e:"Users can spot problems with comfort, ease of use and function that the designer may miss."});

const CNT=TOPICS.map((_,i)=>Q.filter(q=>q.t===i).length);
const ACT=CNT.map((n,i)=>n?i:-1).filter(i=>i>=0);

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s),app=$("#app");
let mem=null;
function load(){try{return JSON.parse(localStorage.getItem("dt_quiz_v2"))||mem||{}}catch(e){return mem||{}}}
function save(d){mem=d;try{localStorage.setItem("dt_quiz_v2",JSON.stringify(d))}catch(e){}}
const pct=(c,n)=>n?Math.round(100*c/n):0;
const KEY=()=>`<details open><summary>Colour chart</summary><div class="tw"><table><tr><th>Colour</th><th>Bands 1 &amp; 2 (digit)</th><th>Band 3 (zeros)</th><th>Band 4 (tolerance)</th></tr>${[
["black",0,"no zeros","–"],["brown",1,"0","±1%"],["red",2,"00","±2%"],["orange",3,"000","–"],["yellow",4,"0000","–"],["green",5,"00000","±0.5%"],["blue",6,"000000","±0.25%"],["violet",7,"–","±0.1%"],["grey",8,"–","–"],["white",9,"–","–"],["gold","–","×0.1","±5%"],["silver","–","×0.01","±10%"]
].map(r=>`<tr><td><i style="display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--bd);background:${COL[r[0]]}"></i>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</table></div></details>`;
let S={};

/* ---------- screens ---------- */
function home(){
app.innerHTML=`<h1>🎄 Year 10 D&amp;T Christmas Exam Revision</h1>
<p class="mu">Answer anonymously. Your score is saved on this device and helps your teacher plan the next lesson.</p>
<div class="card"><h2>Choose your class</h2><div class="row">${CLASSES.map(c=>`<button class="p big" data-c="${c}">Class ${c}</button>`).join("")}</div></div>
<p><button id="tb">Teacher dashboard</button></p>`;
app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>pinScreen("Class "+b.dataset.c+" access",CPIN[b.dataset.c],()=>start(b.dataset.c)));
$("#tb").onclick=()=>pinScreen("Teacher dashboard",TPIN,()=>dash(CLASSES[0]))}
function start(c){S={c,i:0,r:TOPICS.map(()=>[0,0]),qs:shuf(Q).sort((a,b)=>a.t-b.t).map(q=>({...q,opts:shuf(q.o)}))};ask()}
function visual(q){
let h="";
if(q.sym)h+=svgOf(q.sym,160,104);
if(q.img)h+=`<img class="vis" src="${q.img}" alt="Picture for the question">`;
if(q.bands)h+=`<svg class="vis" width="220" height="60" viewBox="0 0 200 50" role="img" aria-label="Resistor with colour bands ${q.bands.join(", ")}"><path d="M0 25h40M160 25h40" stroke="#999" stroke-width="3"/><rect x="38" y="8" width="124" height="34" rx="12" fill="#e8d9b0"/>${q.bands.map((b,i)=>`<rect x="${[55,77,99,135][i]}" y="8" width="11" height="34" fill="${COL[b]}" stroke="#0003"/>`).join("")}</svg><p class="mu" style="text-align:center;margin:0">${q.bands.join(" – ")}</p>`;
return h}
function ask(){
const q=S.qs[S.i];
app.innerHTML=`<div class="mu">Class ${S.c} · Question ${S.i+1} of ${S.qs.length}</div><div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div>
<div class="card"><span class="tag">${TOPICS[q.t]}</span><h2>${q.q}</h2>${visual(q)}${q.key?KEY():""}
${q.opts.map((o,k)=>`<button class="opt${o.startsWith("<svg")?" sv":""}" data-k="${k}">${o}</button>`).join("")}<div id="fb"></div></div>`;
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
const right=q.opts[b.dataset.k]===q.o[0];
app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(q.opts[x.dataset.k]===q.o[0])x.classList.add("ok")});
if(!right)b.classList.add("no");
S.r[q.t][1]++;if(right)S.r[q.t][0]++;
const last=S.i===S.qs.length-1;
$("#fb").innerHTML=`<div class="fb ${right?"ok":"no"}">${right?"✔ Correct!":"✘ Not quite."} ${q.e}</div><button class="p" id="nx">${last?"Finish &amp; see my score":"Next question →"}</button>`;
$("#nx").onclick=()=>last?finish():(S.i++,ask())})}
function formLink(c,r){
const p=["usp=pp_url","entry."+FE.c+"="+encodeURIComponent(c)];
r.forEach((x,i)=>{if(CNT[i])p.push("entry."+FE.t[i]+"="+x[0])});
p.push("entry."+FE.tot+"="+r.reduce((a,x)=>a+x[0],0));
return FORM+"?"+p.join("&")}
function finish(){
const E={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),c:S.c,t:Date.now(),s:S.r};
const d=load();d[S.c]=d[S.c]||[];d[S.c].push(E);save(d);
const C=S.r.reduce((a,x)=>a+x[0],0),N=S.r.reduce((a,x)=>a+x[1],0);
app.innerHTML=`<h1>Quiz complete 🎉</h1><div class="card"><h2>${C} / ${N} (${pct(C,N)}%)</h2>
${ACT.map(i=>{const x=S.r[i];return `<div class="tl"><span>${TOPICS[i]}</span><div class="bar ${pct(x[0],x[1])<60?"low":""}"><i style="width:${pct(x[0],x[1])}%"></i></div><b>${x[0]}/${x[1]}</b></div>`}).join("")}
<p class="mu">Bars in red are topics to revise before the exam.</p></div>
<div class="card" style="border-color:var(--pr)"><h2>Last step: send your result to your teacher</h2><p>Your result is <b>not recorded</b> until you press <b>Submit</b> on the form that opens. Your class and scores are already filled in, and no name is needed.</p><a href="${formLink(S.c,S.r)}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;padding:14px;border-radius:10px;font-weight:600;background:var(--pr);color:#fff">Send my result to my teacher →</a></div>
<div class="row"><button class="p" id="h">Back to start</button></div>`;
$("#h").onclick=home}
function pinScreen(title,PIN,ok){
app.innerHTML=`<h1>${title}</h1><div class="card"><p>Enter PIN</p><div id="dots" style="font-size:2rem;letter-spacing:.4em;min-height:2.6rem;text-align:center">&nbsp;</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto 10px">${[1,2,3,4,5,6,7,8,9,"⌫",0,"C"].map(k=>`<button class="big" data-d="${k}">${k}</button>`).join("")}</div><p id="pe" class="mu" style="text-align:center"></p><div class="row"><button id="bk">Back</button></div></div>`;
let buf="";
const go=()=>{if(buf!==PIN){buf="";$("#dots").innerHTML="&nbsp;";$("#pe").textContent="Incorrect PIN.";return}try{ok()}catch(e){$("#pe").textContent="Error: "+e.message}};
app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const k=b.dataset.d;buf=k==="⌫"?buf.slice(0,-1):k==="C"?"":(buf+k).slice(0,8);$("#dots").textContent=buf?"●".repeat(buf.length):" ";$("#pe").textContent="";if(buf.length>=PIN.length)go()});
$("#bk").onclick=home}
function dash(c){
const R=load(),L=(R[c]||[]).slice().sort((a,b)=>a.t-b.t),n=L.length;
const tot=TOPICS.map((_,i)=>L.reduce((a,s)=>[a[0]+s.s[i][0],a[1]+s.s[i][1]],[0,0]));
const avg=tot.map(x=>pct(x[0],x[1]));
const rank=ACT.map(i=>[avg[i],i]).sort((a,b)=>a[0]-b[0]).slice(0,2);
app.innerHTML=`<h1>Teacher dashboard</h1>
<div class="row">${CLASSES.map(k=>`<button class="${k===c?"p":""}" data-k="${k}">Class ${k} (${(R[k]||[]).length})</button>`).join("")}</div>
<p class="mu">This page shows results saved on this device only. Responses from every device are collected in your Google Form's linked Sheet.</p>
<div class="card"><h2>Class ${c}: ${n} submission${n===1?"":"s"}</h2>
${n?ACT.map(i=>`<div class="tl"><span>${TOPICS[i]}</span><div class="bar ${avg[i]<60?"low":""}"><i style="width:${avg[i]}%"></i></div><b>${avg[i]}%</b></div>`).join(""):'<p class="mu">No submissions yet on this device.</p>'}</div>
${n?`<div class="card"><h2>📌 Next lesson focus</h2>${rank.map(([v,i],k)=>`<p><b>${k+1}. ${TOPICS[i]}</b> (${v}% class average)<br><span class="mu">${FOCUS[i]}</span></p>`).join("")}</div>
<div class="card"><h2>Anonymous submissions</h2><div class="tw"><table><tr><th>Pupil</th><th>Date</th>${ACT.map(i=>`<th>T${i+1}</th>`).join("")}<th>Total</th></tr>
${L.map((s,j)=>{const C=s.s.reduce((a,x)=>a+x[0],0),N=s.s.reduce((a,x)=>a+x[1],0);return `<tr><td>#${j+1}</td><td>${new Date(s.t).toLocaleDateString("en-GB")}</td>${ACT.map(i=>`<td>${s.s[i][0]}/${s.s[i][1]}</td>`).join("")}<td><b>${pct(C,N)}%</b></td></tr>`}).join("")}</table></div>
<p class="mu">${ACT.map(i=>`T${i+1} = ${TOPICS[i]}`).join(" · ")}</p></div>`:""}
<div class="row"><button id="clr">Clear Class ${c} data</button><button id="ex">Exit</button></div>`;
app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>dash(b.dataset.k));
$("#ex").onclick=home;
$("#clr").onclick=function(){if(!this.dataset.s){this.dataset.s=1;this.textContent="Tap again to delete Class "+c+" data";return}const d=load();d[c]=[];save(d);dash(c)}}
home();
</script>
</body>
</html>
